name: Update tree and deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape GitHub Trending
        run: node scripts/scrape-trending.mjs

      - name: Regenerate README
        run: node scripts/build-readme.mjs

      - name: Commit changes
        run: |
          git config user.name "lanmower"
          git config user.email "lanmower@users.noreply.github.com"
          git add data/tree.json README.md
          git diff --cached --quiet || git commit -m "chore: refresh trending tree"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
