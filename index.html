<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>awesome-github</title>
<meta name="description" content="A continuously refreshed tree of trending GitHub repositories, organized by language.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌳</text></svg>">
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #app { min-height: 100vh; }
  .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
  header.site-header { padding: 24px 32px 12px; border-bottom: 1px solid var(--ds-border, #2a2a2a); }
  header.site-header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header.site-header p { margin: 0; opacity: 0.7; font-size: 0.9rem; }
  .toolbar-row { display: flex; gap: 12px; padding: 12px 32px; align-items: center; }
  .toolbar-row input { flex: 1; max-width: 360px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--ds-border, #444); background: transparent; color: inherit; }
  .stats { opacity: 0.6; font-size: 0.85rem; }
  main { flex: 1; overflow: auto; padding: 0 16px 32px; }
  .repo-link { color: inherit; text-decoration: none; }
  .repo-link:hover { text-decoration: underline; }
  .repo-desc { opacity: 0.65; font-size: 0.85em; margin-left: 6px; }
  footer.site-footer { padding: 16px 32px; opacity: 0.5; font-size: 0.8rem; border-top: 1px solid var(--ds-border, #2a2a2a); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.mjs"></script>
</body>
</html>
