<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1A1A">
<title>awesome-github</title>
<meta name="description" content="A continuously refreshed tree of trending GitHub repositories, organized by language.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌳</text></svg>">
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('247420:theme'); } catch (e) {}
    var valid = ['auto', 'paper', 'ink', 'thebird', 'github-dark'];
    var mode = valid.indexOf(stored) !== -1 ? stored : 'auto';
    var resolved = mode === 'auto'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper')
      : mode;
    document.documentElement.classList.add('ds-247420');
    document.documentElement.setAttribute('data-theme', resolved);
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--fg);
    --border: color-mix(in srgb, var(--fg) 18%, var(--bg));
  }
  #app { min-height: 100vh; }
  .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
  header.site-header { padding: 24px 32px 12px; border-bottom: 1px solid var(--border); }
  header.site-header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header.site-header p { margin: 0; opacity: 0.7; font-size: 0.9rem; }
  .site-header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-actions { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .star-cta { flex-shrink: 0; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); color: inherit; text-decoration: none; font-size: 0.9rem; font-weight: 600; white-space: nowrap; transition: background 0.15s; }
  .star-cta:hover { background: var(--bg-2); }
  .toolbar-row { display: flex; gap: 12px; padding: 12px 32px; align-items: center; }
  .toolbar-row input { flex: 1; max-width: 360px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; }
  .stats { opacity: 0.7; font-size: 0.85rem; }
  main { flex: 1; overflow: auto; padding: 0 16px 32px; }
  .repo-link { color: inherit; text-decoration: none; }
  .repo-link:hover { text-decoration: underline; }
  .repo-desc { opacity: 0.75; font-size: 0.85em; margin-left: 6px; }
  footer.site-footer { padding: 16px 32px; opacity: 0.68; font-size: 0.8rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.mjs"></script>
</body>
</html>
